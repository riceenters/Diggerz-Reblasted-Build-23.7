<!doctype html>

<style>

<body>
<div id="loading">Loading Diggerz.io Reblasted 23.8…</div>
<script>
(async function(){
  const RAILWAY_HTTP = 'https://diggerz-multiplayer-test-production.up.railway.app';
  const RAILWAY_WS = 'wss://diggerz-multiplayer-test-production.up.railway.app';

  function replaceAllLiteral(s, from, to){ return s.split(from).join(to); }

  try {
    let html = await (await fetch('game.html', {cache:'no-store'})).text();

    const replacements = [
      [
        "null != l.z39 && 50 < l.z39.a1 && E.v2(Um.n7())",
        "null != l.z39 && 50 < l.z39.a1 && (!window.__diggerzLightswordSfxAt || Date.now() - window.__diggerzLightswordSfxAt >= 120) && (window.__diggerzLightswordSfxAt = Date.now(), E.v2(Um.n7(), new fh(I.__cast(q.player.k8, md) / 100 * .3)))"
      ],
      [
        "            if (lastPlayed[name] && now - lastPlayed[name] < 24) return true;\n            lastPlayed[name] = now;",
        "            var cooldown = /lightsword/.test(name) ? 120 : 24;\n            if (lastPlayed[name] && now - lastPlayed[name] < cooldown) return true;\n            lastPlayed[name] = now;"
      ],
      [
        "            var destination = output(ctx, volume);",
        "            var destination = output(ctx, /lightsword/.test(name) ? volume * .3 : volume);"
      ],
      [
        'usePvpTest ? "Build 23.7 native-packet PvP" : (useLocalDigTrade ? "Build 23.7 native-packet Dig+Trade" : "original multiplayer server")',
        'usePvpTest ? "Build 23.8 native-packet PvP" : (useLocalDigTrade ? "Build 23.8 native-packet Dig+Trade" : "original multiplayer server")'
      ],
      ['z-index: 100;">Build 23.7</div>', 'z-index: 100;">Build 23.8</div>'],
      ['Build 23.7 multiplayer admin tools. Konami sequence + server-authorized admin session required.', 'Build 23.8 multiplayer admin tools. Konami sequence + server-authorized admin session required.'],
      ['<h2>Build 23.7 — Diggerz Multiplayer</h2>', '<h2>Build 23.8 — Diggerz Multiplayer</h2>'],
      ['<span>MP DEBUG 23.7</span>', '<span>MP DEBUG 23.8</span>'],
      ["build:'23.7'", "build:'23.8'"]
    ];

    for (const pair of replacements) {
      if (html.includes(pair[0])) html = html.replace(pair[0], pair[1]);
    }

    // Remove the old login/logout menu and browser account client.
    const loginStart = html.indexOf('            N.startsWith(q.thisMain.userPW, "NOPASSWORD")');
    const shopText = loginStart >= 0 ? html.indexOf('            this.d51.E37("Shop");', loginStart) : -1;
    const shopStart = shopText >= 0 ? html.lastIndexOf('            b = new z;', shopText) : -1;
    if (loginStart >= 0 && shopStart > loginStart) {
      html = html.slice(0, loginStart) +
        '            q.thisMain.userEmail = "";\n            q.thisMain.userPW = "";\n' +
        html.slice(shopStart);
    }

    const authScriptStart = html.indexOf('<script id="diggerz-build23-7-security-patch">');
    const authScriptEnd = authScriptStart >= 0 ? html.indexOf('</script>', authScriptStart) : -1;
    if (authScriptStart >= 0 && authScriptEnd > authScriptStart) {
      const noLoginScript = '<script id="diggerz-build23-8-no-login-patch">(function(){try{localStorage.removeItem("diggerz.resurrection.accounts.v1");localStorage.removeItem("diggerz.resurrection.boundEmail.v1");sessionStorage.removeItem("diggerz.auth.active.v1");delete window.DiggerzAuth237}catch(e){}var n=0,t=setInterval(function(){n++;try{if(window.q&&q.thisMain){q.thisMain.userEmail="";q.thisMain.userPW="";if(typeof q.SaveGlobals==="function")q.SaveGlobals();clearInterval(t)}}catch(e){}if(n>100)clearInterval(t)},100)}());<\/script>';
      html = html.slice(0, authScriptStart) + noLoginScript + html.slice(authScriptEnd + 9);
    }

    // Route multiplayer and admin traffic to Railway.
    html = html.replace(
      "    if(location.protocol==='https:')return 'wss://'+location.host;",
      "    if(location.protocol==='https:')return '"+RAILWAY_WS+"';"
    );

    ['/api/admin/auth','/api/admin/bans','/api/admin/moderate'].forEach(function(apiPath){
      html = replaceAllLiteral(html, "fetch('"+apiPath+"'", "fetch('"+RAILWAY_HTTP+apiPath+"'");
    });

    html = replaceAllLiteral(
      html,
      "window.open('/map-editor','diggerz-map-editor')",
      "window.open('"+RAILWAY_HTTP+"/map-editor','diggerz-map-editor')"
    );

    // Keep bans inside the itch-hosted client instead of leaving itch.
    html = replaceAllLiteral(html, "location.replace('/banned')", "location.replace('banned.html')");

    // itch HTML games live inside a subdirectory; absolute asset paths would 403.
    html = replaceAllLiteral(html, "'/levelup.ogg'", "'levelup.ogg'");
    html = replaceAllLiteral(html, '"/levelup.ogg"', '"levelup.ogg"');
    html = replaceAllLiteral(html, "'/balloon_pop.ogg'", "'balloon_pop.ogg'");
    html = replaceAllLiteral(html, '"/balloon_pop.ogg"', '"balloon_pop.ogg"');
    html = replaceAllLiteral(html, "'/swap.ogg'", "'swap.ogg'");
    html = replaceAllLiteral(html, '"/swap.ogg"', '"swap.ogg"');
    html = replaceAllLiteral(html, "'/music_theme", "'music_theme");
    html = replaceAllLiteral(html, '"/music_theme', '"music_theme');

    const marker = '<hr><a name="Build 23.7"></a>';
    if (!html.includes('Build 23.8 - Railway / itch Migration & Fixes') && html.includes(marker)) {
      const section = '<hr><a name="Build 23.8"></a> <h2>Build 23.8 - Railway / itch Migration &amp; Fixes</h2> <ul> <li>Reduced lightsword swing sound volume to 30% and added a 120 ms anti-spam cooldown.</li> <li>Fixed server-authorized admin item, coin, and kill actions when an admin targets themselves.</li> <li>Removed the player login / logout feature and retired the passwordless account client. Diggerz now runs guest-only.</li> <li>Routes multiplayer and protected admin requests to the Railway backend while the client is hosted by itch.io.</li> <li>Updated active multiplayer build identifiers to 23.8.</li> </ul> ';
      html = html.replace(marker, section + marker);
    }

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.getElementById('loading').textContent = 'Diggerz failed to load: ' + (err && err.message ? err.message : String(err));
  }
})();
</script>
